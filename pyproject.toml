[project]
name = "stochastic-process"
version = "0.1.0"
description = "확률 과정(stochastic processes) 자습용 Jupyter 노트북 과정과 공용 시뮬레이션 패키지 spkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "jupytext>=1.17",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "nbmake>=1.5",
    "nbstripout>=0.8",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "NPY", "B", "UP"]
ignore = ["E501"]
